# Source-built React/Vite frontend for Netlify.
# Express API is NOT hosted on Netlify. Keep it on a Node-compatible host,
# with https://api.sanatpish.com configured before enabling production users.
[build]
  base = "."
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Proxy same-origin API requests to the independently deployed Express server.
# Netlify proxies do not turn Express into a Netlify Function.
[[redirects]]
  from = "/api/*"
  to = "https://api.sanatpish.com/api/:splat"
  status = 200
  force = true

# Only application routes (not missing static assets) should use the SPA fallback.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
