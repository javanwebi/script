    <text x="261" y="729" text-anchor="middle" class="font-mono" font-size="13.5" font-weight="700" fill="#E56B1E">Lp = 647.70 mm  (25.5 inch)</text>

    <text x="674" y="763" text-anchor="end" font-weight="700" fill="#55565A">‫تعداد دندانه‬</text>
    <text x="261" y="763" text-anchor="middle" class="font-mono" font-size="13.5" font-weight="700" fill="#1F2022">z = 68 Teeth</text>

    <text x="674" y="797" text-anchor="end" font-weight="700" fill="#55565A">‫عرض مقطع تسمه‬</text>
