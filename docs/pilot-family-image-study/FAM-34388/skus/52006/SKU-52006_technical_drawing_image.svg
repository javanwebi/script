    <text x="261" y="593" text-anchor="middle" class="font-mono" font-size="14" font-weight="700" fill="#E56B1E">52006</text>

    <text x="674" y="627" text-anchor="end" font-weight="700" fill="#55565A">‫شماره فنی سازنده‬</text>
    <text x="261" y="627" text-anchor="middle" class="font-mono" font-size="13.5" font-weight="700" fill="#1F2022">optibelt ZR 255 L 050</text>

    <text x="674" y="661" text-anchor="end" font-weight="700" fill="#55565A">‫برند و کشور سازنده‬</text>
    <text x="261" y="661" text-anchor="middle" class="font-mono" font-size="13" font-weight="700" fill="#1F2022">OPTIBELT (Arntz Optibelt Group — Germany)</text>

    <text x="674" y="695" text-anchor="end" font-weight="700" fill="#55565A">‫پروفیل و گام دندانه‬</text>
    <text x="261" y="695" text-anchor="middle" class="font-mono" font-size="13" font-weight="700" fill="#1F2022">Profile L  |  p = 9.525 mm (3/8 in)</text>

