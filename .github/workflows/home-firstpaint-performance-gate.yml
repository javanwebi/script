name: Home first-paint performance and privacy gate
on:
  push:
    branches:
      - perf/home-first-paint-lightweight-20261102
      - perf/home-preload-categories-20261102
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: TypeScript verification
        run: npm run lint
      - name: Fast preview and lazy UI tests
        run: node --import tsx --test tests/home-fast-preview.test.ts tests/home-initial-load.test.ts tests/client-logos-hydration.test.ts
      - name: Frontend production build
        run: npm run build
