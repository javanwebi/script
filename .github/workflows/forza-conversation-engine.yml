name: FORZA Conversation Engine

on:
  pull_request:
    branches: [main]
    paths:
      - "src/components/forza/**"
      - "src/utils/forzaConversationEngine.ts"
      - "src/utils/clientAiSegmentation.ts"
      - "src/components/search/AiVisualPartSearchModal.tsx"
      - "server/ai/forzaDibaStt.ts"
      - "server/ai/forzaSttQueue.ts"
      - "tests/forza-conversation-engine.test.ts"
      - "tests/forza-speech-pipeline.test.ts"
      - "tests/forzaBrowserRecognitionLifecycle.test.ts"
      - "tests/forzaCallTeardown.test.ts"
      - "tests/forza-diba-queue.test.ts"
      - "server.ts"
      - "server/ai/forzaLiveGateway.ts"
      - "src/pages/AiForzaPage.tsx"
      - "src/components/search/AiForzaFaceToFaceModal.tsx"
      - "src/components/layout/RouteIntentPreload.tsx"
      - "tests/forza-live-gateway.test.ts"
      - "tests/forza-live-experience.test.ts"
      - "tests/forza-live-browser-simulation.test.ts"
      - "tests/forzaVoiceRecoveryUi.test.ts"
      - "docs/forza/FORZA_LIVE_GATEWAY_REBUILD_20261124.md"
      - ".env.example"
      - "server.ts"
      - "server/ai/forzaLiveGateway.ts"
      - "src/pages/AiForzaPage.tsx"
      - "src/components/search/AiForzaFaceToFaceModal.tsx"
      - "src/components/layout/RouteIntentPreload.tsx"
      - "tests/forza-live-gateway.test.ts"
      - "tests/forza-live-experience.test.ts"
      - "tests/forza-live-browser-simulation.test.ts"
      - "tests/forzaVoiceRecoveryUi.test.ts"
      - "docs/forza/FORZA_LIVE_GATEWAY_REBUILD_20261124.md"
      - ".env.example"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/forza-conversation-engine.yml"
  push:
    branches:
      - "feat/forza-conversation-engine-v2-*"
    paths:
      - "src/components/forza/**"
      - "src/utils/forzaConversationEngine.ts"
      - "server/ai/forzaDibaStt.ts"
      - "server/ai/forzaSttQueue.ts"
      - "tests/forza-conversation-engine.test.ts"
      - "tests/forza-speech-pipeline.test.ts"
      - "tests/forzaBrowserRecognitionLifecycle.test.ts"
      - "tests/forzaCallTeardown.test.ts"
      - "tests/forza-diba-queue.test.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/forza-conversation-engine.yml"

permissions:
  contents: read

concurrency:
  group: forza-conversation-engine-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  conversation-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install pinned ONNX runtime for visual segmentation typecheck
        run: npm install --no-save --package-lock=false --legacy-peer-deps --no-audit --no-fund onnxruntime-web@1.18.0

      - name: Test native FORZA Live gateway and browser
        run: npm run test:forza-live

      - name: Test conversation engine and regression suite
        run: npm run test:forza-engine

      - name: TypeScript validation
        run: npm run lint
