name: FORZA Mana Piper TTS — API contract and container
on:
  pull_request:
    paths:
      - 'services/forza-tts/**'
      - 'src/services/forzaTtsClient.ts'
      - 'tests/forza-tts-client.test.ts'
      - '.github/workflows/forza-mana-tts.yml'
  push:
    paths:
      - 'services/forza-tts/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  private-tts-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'fastapi==0.118.0' 'httpx>=0.27,<1'
      - run: python -m compileall -q services/forza-tts
      - run: python -m unittest discover -s services/forza-tts -p 'test_*.py' -v
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify a deployable Docker image with actual model assets
        run: docker build --pull --progress=plain -t forza-mana-tts:ci services/forza-tts
