name: Real local Supabase Auth Storage and JWT policy checks

on:
  push:
    branches: [fix/adopted-backfill-safety-20261022]
    paths:
      - '.github/workflows/local-supabase-services.yml'
      - 'scripts/database/testLocalSupabaseServices.ts'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/local-supabase-services.yml'
      - 'scripts/database/testLocalSupabaseServices.ts'

permissions:
  contents: read

concurrency:
  group: local-supabase-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auth-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI_SUPABASE_LOCAL_ONLY: 'true'
      CI_SUPABASE_STATUS_FILE: "${{ runner.temp }}/sanatpish-supabase-status.json"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies and pinned Supabase CLI
        run: npm ci
      - name: Initialize isolated local-only Supabase CLI directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sanatpish-supabase-ci"
          cd "$RUNNER_TEMP/sanatpish-supabase-ci"
          "$GITHUB_WORKSPACE/node_modules/.bin/supabase" --version
          "$GITHUB_WORKSPACE/node_modules/.bin/supabase" init
          "$GITHUB_WORKSPACE/node_modules/.bin/supabase" start
          "$GITHUB_WORKSPACE/node_modules/.bin/supabase" status -o json > "$CI_SUPABASE_STATUS_FILE"
      - name: Apply owner-provided database schema and adopted migrations to LOCAL Supabase
        shell: bash
        run: |
          set -euo pipefail
          CI_DB_URL="$(node -e 'const d=JSON.parse(require("fs").readFileSync(process.env.CI_SUPABASE_STATUS_FILE,"utf8"));process.stdout.write(d.DB_URL)')"
          if [[ "$CI_DB_URL" != *"127.0.0.1:54322/"* ]]; then
            echo "Refusing non-loopback Supabase PostgreSQL"
            exit 1
          fi
          psql "$CI_DB_URL" -v ON_ERROR_STOP=1 -f supabase/adopted/baseline/user_supplied_master.sql > /dev/null
          for migration in supabase/adopted/migrations/[0-9]*.sql; do
            psql "$CI_DB_URL" -v ON_ERROR_STOP=1 -f "$migration" > /dev/null
          done
      - name: Real local Auth Storage RLS service tests
        run: node --import tsx scripts/database/testLocalSupabaseServices.ts
      - name: Shut down isolated local Supabase
        if: always()
        shell: bash
        run: |
          if [ -d "$RUNNER_TEMP/sanatpish-supabase-ci/supabase" ]; then
            cd "$RUNNER_TEMP/sanatpish-supabase-ci"
            "$GITHUB_WORKSPACE/node_modules/.bin/supabase" stop --no-backup || true
          fi
