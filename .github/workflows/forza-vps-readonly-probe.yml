name: FORZA VPS public read-only probe
on:
  pull_request:
    paths:
      - 'src/components/forza/**'
      - 'src/utils/forzaBargeIn.ts'
      - 'src/utils/forzaContinuousWav.ts'
      - 'server.ts'
      - 'scripts/forza_nima_voice_http.py'
      - '.github/workflows/forza-vps-readonly-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe actual public FORZA host without requests to LLM or TTS
        shell: bash
        run: |
          set -u
          BASE='https://87.107.152.92'
          for route in /ai-forza /api/health /api/ai/forza-voice-info; do
            echo "CHECK $route"
            curl --noproxy '*' -k -sS --connect-timeout 5 --max-time 12 \
              -o /tmp/forza-public-body \
              -w 'http=%{http_code} type=%{content_type} bytes=%{size_download} total_seconds=%{time_total}\n' \
              "$BASE$route" || echo "UNREACHABLE $route"
            case "$route" in
              /ai-forza) grep -Eo '(/assets/)?index-[A-Za-z0-9_-]+\\.js' /tmp/forza-public-body | head -1 || true;;
              /api/health|/api/ai/forza-voice-info) head -c 250 /tmp/forza-public-body || true; echo;;
            esac
          done
          echo "A public endpoint without an embedded immutable build SHA cannot establish deployed Git commit."
