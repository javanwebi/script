name: FORZA Nima private voice and SSE speech tests
on:
  pull_request:
    paths:
      - Dockerfile
      - Dockerfile.forza-nima
      - scripts/forza_diba_stt_worker.py
      - server/ai/forzaDibaStt.ts
      - server/ai/forzaSttProvider.ts
      - tests/forza-live-voice-regression.test.ts
      - scripts/forza_nima_voice_http.py
      - docs/forza/NIMA_GYRO_LIVE_STREAM.md
      - ops/deploy-forza-nima-pinned-vps.sh
      - ops/deploy-main-bluegreen-vps.sh
      - ops/forza-nima-private-canary-vps.sh
      - ops/forza-nima-go-live-vps.sh
      - ops/sanatpish-deploy.sh
      - ops/forza-nima-rollback-vps.sh
      - server.ts
      - src/components/forza/AiForzaCallExperience.tsx
      - src/utils/forzaIncrementalSpeechText.ts
      - src/utils/forzaNimaBufferedSpeech.ts
      - src/utils/forzaBargeIn.ts
      - src/utils/forzaContinuousWav.ts
      - tests/forzaBargeIn.test.ts
      - tests/forza-smart-turn.test.ts
      - tests/forza-speech-pipeline.test.ts
      - tests/forzaNimaIncrementalSpeech.test.ts
      - tests/forzaNimaBufferedSpeech.test.ts
      - tests/forzaVoiceRetry.test.ts
      - tests/forzaTtsBudget.test.ts
      - tests/forza-streaming-speech.test.ts
      - tests/forzaVoiceRecoveryUi.test.ts
      - tests/forzaLiveAuditScript.test.ts
      - ops/forza-live-voice-audit-readonly.sh
      - ops/deploy-single-port-vps.sh
      - server/ai/forzaTtsBudget.ts
      - src/utils/forzaStreamClient.ts
      - src/utils/forzaSpeechPipeline.ts
      - src/utils/forzaRecognitionRecovery.ts
      - tests/forzaRecognitionRecovery.test.ts
      - tests/forzaBrowserRecognitionLifecycle.test.ts
      - src/utils/forzaStopAcknowledgement.ts
      - tests/forzaStopAcknowledgement.test.ts
      - tests/forzaCallTeardown.test.ts
      - tests/forzaConsultContract.test.ts
      - tests/forzaSseImmediateCompletion.test.ts
      - tests/forza-live-voice-regression.test.ts
      - licenses/DIBA-STT-NOTICE.txt
      - src/components/forza/ParticleAvatar.tsx
      - server/ai/forzaVoiceRetry.ts
      - tests/test_forza_nima_private.py
      - tests/test_forza_nima_pool.py
      - ops/upgrade-forza-realtime-vps.sh
      - .github/workflows/forza-nima-private.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Nima isolated service source and safety
        run: python3 -m unittest discover -s tests -p 'test_forza_nima*.py'
      - name: Install frontend/toolchain
        run: npm ci --ignore-scripts
      - name: Test incremental SSE speech planner
        run: node --import tsx --test tests/forzaCallPlainText.test.ts tests/forzaNimaIncrementalSpeech.test.ts tests/forzaNimaBufferedSpeech.test.ts tests/forzaVoiceRetry.test.ts tests/forzaTtsBudget.test.ts tests/forza-streaming-speech.test.ts tests/forzaVoiceRecoveryUi.test.ts tests/forzaLiveAuditScript.test.ts tests/forza-continuous-wav.test.ts tests/forzaBargeIn.test.ts tests/forza-voice-activity.test.ts tests/forzaRecognitionRecovery.test.ts tests/forzaBrowserRecognitionLifecycle.test.ts tests/forzaStopAcknowledgement.test.ts tests/forzaCallTeardown.test.ts tests/forzaConsultContract.test.ts tests/forzaSseImmediateCompletion.test.ts tests/forza-live-voice-regression.test.ts
      - name: Validate Persian smart end-of-turn recognition
        run: node --import tsx --test tests/forza-smart-turn.test.ts tests/forza-speech-pipeline.test.ts
      - name: Verify xKiro chat keys never activate Gemini speech recognition
        run: node --import tsx --test tests/forza-stt-provider.test.ts tests/forza-live-voice-regression.test.ts
      - name: Typecheck website and voice endpoints
        run: npm run lint
