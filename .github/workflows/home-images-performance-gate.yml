name: Homepage Image Performance and Visual Safety
on:
  push:
    branches:
      - perf/home-images-webp-priority-20261102
  workflow_dispatch:

jobs:
  image-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: node --import tsx --test tests/home-image-loading.test.ts tests/home-fast-preview.test.ts tests/home-initial-load.test.ts tests/client-logos-hydration.test.ts
      - run: npm run build
      - name: Ensure optimized image files were generated and bundled
        run: |
          test -s "src/assets/images/mobile/brands_fullbleed_bg_1791282424638.webp"
          test -s "src/assets/images/mobile/parts_warehouse_vault_1791289671081.webp"
          test -s "src/assets/IMAGESITE/mobile/Futuristic FORZA AI Robot Halo.webp"
          test -s "src/assets/IMAGESITE/mobile/Levitating Orbital Engine Assembly (1).webp"
          test -s dist/index.html
