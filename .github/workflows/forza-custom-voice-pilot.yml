name: FORZA custom Piper voice preparation (offline only)
on:
  pull_request:
    paths:
      - scripts/forza_custom_voice_dataset_gate.py
      - scripts/forza_custom_corpus_prompts.py
      - scripts/forza_piper_custom_benchmark.py
      - ops/forza-piper-custom-train-gpu.sh
      - ops/forza-piper-custom-export-gpu.sh
      - ops/forza-piper-custom-cpu-gate-vps.sh
      - ops/Dockerfile.forza-custom-piper-bench
      - docs/forza/CUSTOM_FAST_VOICE_PIPER_PILOT.md
      - tests/test_forza_custom_voice_pilot.py
      - .github/workflows/forza-custom-voice-pilot.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  no-production-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile and test offline code without models, audio or GPU
        run: |
          python3 -m py_compile scripts/forza_custom_voice_dataset_gate.py scripts/forza_custom_corpus_prompts.py scripts/forza_piper_custom_benchmark.py
          python3 tests/test_forza_custom_voice_pilot.py
      - name: Verify no training or live deployment in CI
        run: |
          bash -n ops/forza-piper-custom-train-gpu.sh
          bash -n ops/forza-piper-custom-export-gpu.sh
          bash -n ops/forza-piper-custom-cpu-gate-vps.sh
          grep -F 'FORZA_VOICE_RIGHTS_CONFIRMED' ops/forza-piper-custom-train-gpu.sh
          grep -F -- '--network none' ops/forza-piper-custom-cpu-gate-vps.sh
