name: Verify source UI and database runtime
on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/source-ui-postgres-data-boundary-20261022]
permissions:
  contents: read
jobs:
  database-and-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Check TypeScript
        run: npm run lint
      - name: Database tests (isolated PGlite)
        run: npm run test:database
      - name: Portal tests
        run: npm run test:portal
      - name: Build static React frontend from source
        run: npm run build
