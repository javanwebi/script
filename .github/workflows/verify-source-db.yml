name: Verify source UI and database runtime
on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/source-ui-postgres-data-boundary-20261022]
permissions:
  contents: read
jobs:
  database-and-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Install pinned FORZA browser voice dependencies
        run: npm install --no-save --package-lock=false --legacy-peer-deps --no-audit --no-fund @mintplex-labs/piper-tts-web@1.0.5 onnxruntime-web@1.18.0 @diffusionstudio/piper-wasm@1.0.0 vosk-browser@0.0.8
      - name: Check TypeScript
        run: npm run lint
      - name: B.AI and xKiro FORZA stream and fallback regressions
        run: node --import tsx --test tests/bai-consult.test.ts
      - name: Database tests (isolated PGlite)
        run: npm run test:database
      - name: Portal tests
        run: npm run test:portal
      - name: Check private JSON archive maintenance CLI syntax
        run: node --check scripts/database/syncGithubJsonArchive.mjs
      - name: Product image storage regressions
        run: node --import tsx --test tests/product-image-storage.test.ts
      - name: Guard retired operational JSON
        run: node scripts/database/check-json-retirement.mjs
      - name: Admin catalog hierarchy regression tests
        run: node --import tsx --test tests/admin-catalog-hierarchy.test.ts
      - name: Catalog regression tests
        run: node --import tsx --test tests/product-families.test.ts tests/product-technical-data.test.ts tests/owner-catalogue.test.ts tests/imperial-reference.test.ts tests/image-assignments.test.ts tests/part-measurements.test.ts tests/recognition-policy.test.ts tests/catalog-image-scan.test.ts tests/catalog-photo-identity.test.ts
      - name: FORZA read-only visual agent regression tests
        run: node --import tsx --test tests/vision-catalog-agent.test.ts
      - name: FORZA real-time PCM / VAD protocol regressions
        run: node --import tsx --test tests/forza-realtime.test.ts tests/forza-live-browser-simulation.test.ts tests/forza-speech-pipeline.test.ts tests/forza-speech-chunks.test.ts tests/forza-tts-format.test.ts tests/forza-voice-activity.test.ts tests/forza-worker-protocol.test.ts
      - name: Validate low-latency Persian speech and local TTS transport
        run: node --import tsx --test tests/forza-streaming-speech.test.ts tests/forza-tts-client.test.ts tests/forza-boot-speech.test.ts
      - name: Build static React frontend from source
        run: npm run build
