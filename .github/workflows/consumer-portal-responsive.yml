      - 'src/pages/NotFoundPage.tsx'
      - 'src/pages/about-page-approved.css'
      - 'src/pages/ContactUsPage.tsx'
      - 'src/pages/ProductsPage.tsx'
      - 'src/pages/SearchPage.tsx'
      - 'src/pages/DirectSkuDetailPage.tsx'
      - 'src/catalog-experience.css'
      - 'src/index.css'
      - 'tests/catalog-route-safety.test.ts'
      - 'scripts/tests/catalog-routes-responsive-smoke.cjs'
      - 'src/pages/CategoryPage.tsx'
      - 'src/pages/AllCategoriesPage.tsx'
      - 'src/pages/ProductDetailPage.tsx'
      - 'src/services/clientService.ts'
      - 'src/utils/pageMeta.ts'
      - 'tests/company-pages-art-direction.test.ts'
      - 'tests/site-finalization.test.ts'
  pull_request:
    branches: [main]
    paths:
      - 'src/components/portal/**'
      - 'src/components/common/BrandIdentity.tsx'
      - 'src/components/common/AiFloatingButton.tsx'
      - 'src/assets/forza-workspace-mark.svg'
      - 'src/components/layout/**'
      - 'src/admin/**'
      - 'src/components/auth/**'
      - 'tests/official-brand-logo-placement.test.ts'
      - 'tests/consumer-reference-parity-v3.test.ts'
      - 'tests/consumer-dashboard-performance.test.ts'
      - 'src/utils/consumerCatalogView.ts'
      - 'src/pages/ConsumerDashboardPage.tsx'
      - 'src/pages/DiscoveryPages.tsx'
      - 'src/about-page-approved.css'
      - 'src/main.tsx'
      - 'tests/phase9-about-vision-design.test.tsx'
      - 'scripts/tests/company-pages-responsive-smoke.cjs'
      - 'scripts/tests/consumer-portal-responsive-smoke.cjs'
      - '.github/workflows/consumer-portal-responsive.yml'
      - 'api/portal.ts'
      - 'index.html'
      - 'package.json'
      - 'src/App.tsx'
      - 'src/components/home/HomeKnowledge.tsx'
      - 'src/components/home/MainBrandsBanner.tsx'
      - 'src/company-pages-art-direction.css'
      - 'src/catalogue-premium.css'
      - 'src/industry-art-direction.css'
      - 'src/industry-pages-premium.css'
      - 'src/pages/AboutPage.tsx'
      - 'src/pages/CompanyPagesExperience.tsx'
      - 'src/pages/NotFoundPage.tsx'
      - 'src/pages/about-page-approved.css'
      - 'src/pages/ContactUsPage.tsx'
      - 'src/pages/ProductsPage.tsx'
      - 'src/pages/SearchPage.tsx'
      - 'src/pages/DirectSkuDetailPage.tsx'
      - 'src/catalog-experience.css'
      - 'src/index.css'
      - 'tests/catalog-route-safety.test.ts'
      - 'scripts/tests/catalog-routes-responsive-smoke.cjs'
      - 'src/pages/CategoryPage.tsx'
      - 'src/pages/AllCategoriesPage.tsx'
      - 'src/pages/ProductDetailPage.tsx'
      - 'src/services/clientService.ts'
      - 'src/utils/pageMeta.ts'
      - 'tests/company-pages-art-direction.test.ts'
      - 'tests/site-finalization.test.ts'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  responsive-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: TypeScript check
        run: npm run lint
      - name: Site finalization routes, CRM submission and link regressions
        run: node --import tsx --test tests/site-finalization.test.ts tests/company-pages-art-direction.test.ts tests/catalog-refinement.test.ts tests/industry-pages-unique-layouts.test.ts
      - name: Catalogue routes, direct SKU and design-system regressions
        run: node --import tsx --test tests/catalog-route-safety.test.ts
      - name: Official website and FORZA logo placement tests
        run: node --import tsx --test tests/official-brand-logo-placement.test.ts
      - name: Company pages and customer price visibility regression tests
        run: node --import tsx --test tests/phase9-about-vision-design.test.tsx tests/customer-pricing-visibility.test.ts
      - name: Reference parity source tests
        run: node --import tsx --test tests/consumer-reference-parity-v3.test.ts
      - name: Retail catalog correctness and render performance
        run: node --import tsx --test tests/consumer-dashboard-performance.test.ts
      - name: Production bundle
        run: npm run build
      - name: Install browser dependencies
        run: |
          npm install --no-save --ignore-scripts --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Launch local Vite preview
        run: |
          nohup npx vite preview --host 127.0.0.1 --port 4173 > /tmp/consumer-preview.log 2>&1 &
          for i in $(seq 1 50); do
            if curl -sf http://127.0.0.1:4173/consumer-dashboard >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/consumer-preview.log
          exit 1
      - name: Verify company pages, About navigation and desktop/mobile overflow
        run: node scripts/tests/company-pages-responsive-smoke.cjs
      - name: Verify catalogue direct routes and responsive product layouts
        run: node scripts/tests/catalog-routes-responsive-smoke.cjs
      - name: Verify responsive layout, RTL navigation and account drawer
        run: node scripts/tests/consumer-portal-responsive-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: consumer-portal-responsive-screenshots
          path: |
            /tmp/consumer-portal-*.png
            /tmp/company-pages-*.png
            /tmp/catalog-category-*.png
          if-no-files-found: ignore
