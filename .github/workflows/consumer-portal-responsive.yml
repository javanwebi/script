name: Consumer portal responsive UI smoke
on:
  push:
    branches: [design/consumer-premium-dashboard-20261101]
    paths:
      - 'src/components/portal/**'
      - 'src/pages/ConsumerDashboardPage.tsx'
      - 'scripts/tests/consumer-portal-responsive-smoke.cjs'
      - '.github/workflows/consumer-portal-responsive.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/components/portal/**'
      - 'src/pages/ConsumerDashboardPage.tsx'
      - 'scripts/tests/consumer-portal-responsive-smoke.cjs'
      - '.github/workflows/consumer-portal-responsive.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  responsive-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: TypeScript check
        run: npm run lint
      - name: Production bundle
        run: npm run build
      - name: Install browser dependencies
        run: |
          npm install --no-save --ignore-scripts --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Launch local Vite preview
        run: |
          nohup npx vite preview --host 127.0.0.1 --port 4173 > /tmp/consumer-preview.log 2>&1 &
          for i in $(seq 1 50); do
            if curl -sf http://127.0.0.1:4173/consumer-dashboard >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/consumer-preview.log
          exit 1
      - name: Verify responsive layout, RTL navigation and account drawer
        run: node scripts/tests/consumer-portal-responsive-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: consumer-portal-responsive-screenshots
          path: /tmp/consumer-portal-*.png
          if-no-files-found: ignore
