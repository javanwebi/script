name: Sanat Pish catalog bootstrap performance gate
on:
  pull_request:
    branches: [main]
    paths:
      - 'server/db/runtimeApi.ts'
      - 'server.ts'
      - 'src/data/mockGenerator.ts'
      - 'src/pages/ProductDetailPage.tsx'
      - 'src/utils/catalogPrivacy.ts'
      - 'tests/catalog-bootstrap-compact.test.ts'
      - '.github/workflows/catalog-bootstrap-performance-gate.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript safety
        run: npm run lint
      - name: Catalog bootstrap unit tests
        run: node --import tsx --test tests/catalog-bootstrap-compact.test.ts
      - name: Frontend production build
        run: npm run build
