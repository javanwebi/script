name: FORZA visual recognition and crop interaction
on:
  pull_request:
    branches: [main]
    paths:
      - 'server.ts'
      - 'src/components/search/AiVisualPartSearchModal.tsx'
      - 'src/utils/clientAiSegmentation.ts'
      - 'src/utils/clientAiSegmentation.worker.ts'
      - 'src/utils/foregroundRegion.ts'
      - 'scripts/prepare-vision-assets.mjs'
      - 'scripts/tests/client-ai-segmentation-browser.cjs'
      - 'tests/client-ai-segmentation.test.ts'
      - 'tests/fixtures/client-ai-segmentation.html'
      - 'tests/fixtures/client-ai-segmentation.ts'
      - 'Dockerfile'
      - 'ops/deploy-new-vps.sh'
      - 'ops/deploy-single-port-vps.sh'
      - 'ops/sanatpish-deploy.sh'
      - 'src/components/search/ImageRegionReview.tsx'
      - 'src/components/search/image-region-review.css'
      - 'src/components/search/VisionAnalysisProgress.tsx'
      - 'src/components/search/vision-analysis-progress.css'
      - 'src/components/search/ImageRegionSelector.tsx'
      - 'src/components/search/LocalModelResults.tsx'
      - 'src/components/search/industrial-scan.css'
      - 'src/services/aiVisualSearchService.ts'
      - 'src/services/localVisionDetectionCache.ts'
      - 'src/services/localModelSuggestions.ts'
      - 'src/services/localVision.ts'
      - 'src/services/beltRecognition.ts'
      - 'tests/belt-recognition.test.ts'
      - 'tests/forza-vision-kiki-fastpath.test.ts'
      - 'src/services/catalogVisualIndex.ts'
      - 'src/services/localQueryImage.ts'
      - 'src/utils/imageRegionInteraction.ts'
      - 'src/utils/imageRegion.ts'
      - 'tests/local-model-suggestions.test.ts'
      - 'tests/local-model-results.test.tsx'
      - 'tests/local-vision.test.ts'
      - 'tests/local-vision-detection-cache.test.ts'
      - 'tests/customer-image-memory-only.test.ts'
      - 'tests/catalog-visual-index.test.ts'
      - 'tests/mobile-scan-ui.test.ts'
      - 'tests/image-region-interaction.test.ts'
      - 'tests/local-query-image.test.ts'
      - 'scripts/tests/image-region-interaction.cjs'
      - 'services/local-vision/**'
      - 'ops/setup-local-vision-vps.sh'
      - 'ops/deploy-single-port-vps.sh'
      - '.github/workflows/visual-recognition.yml'
permissions:
  contents: read
jobs:
  frontend-and-interaction:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked project dependencies
        run: npm ci --no-audit --no-fund
      - name: Install pinned browser vision runtime
        run: npm install --no-save --package-lock=false --legacy-peer-deps --no-audit --no-fund onnxruntime-web@1.18.0
      - name: Stage verified local vision model and WASM
        run: |
          mkdir -p public/forza-runtime/ort
          cp node_modules/onnxruntime-web/dist/ort-wasm*.wasm public/forza-runtime/ort/
          node scripts/prepare-vision-assets.mjs
      - name: Client-side vision segmentation regressions
        run: node --import tsx --test tests/client-ai-segmentation.test.ts
      - name: TypeScript check
        run: npm run lint
      - name: Visual recognition ranking, no-match and region tests
        run: >-
          node --import tsx --test
          tests/local-model-suggestions.test.ts
          tests/local-model-results.test.tsx
          tests/local-vision.test.ts
          tests/local-vision-detection-cache.test.ts
          tests/customer-image-memory-only.test.ts
          tests/catalog-visual-index.test.ts
          tests/image-region-interaction.test.ts
          tests/local-query-image.test.ts
          tests/belt-recognition.test.ts
          tests/forza-vision-kiki-fastpath.test.ts
      - name: Install pinned Playwright browser runner
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1 onnxruntime-web@1.18.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Real U2NetP browser inference on an industrial photo
        run: node scripts/tests/client-ai-segmentation-browser.cjs
      - name: Real desktop/mobile pointer, crop and upload reuse smoke
        run: node scripts/tests/image-region-interaction.cjs
      - name: Validate private sidecar setup script syntax
        run: bash -n ops/setup-local-vision-vps.sh
      - name: Validate production deploy script syntax
        run: bash -n ops/deploy-single-port-vps.sh
      - name: Production frontend build
        run: npm run build

  local-vision-worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the pinned CPU-only PyTorch runtime
        run: >-
          python -m pip install --no-cache-dir
          'torch==2.8.0+cpu'
          --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Install pinned image worker dependencies
        run: python -m pip install --no-cache-dir -r services/local-vision/requirements.txt
      - name: Test deterministic crop proposals, image bounds and private worker protocol
        run: python -m unittest discover -s services/local-vision -p 'test_*.py' -v
      - name: Check private sidecar setup script syntax
        run: bash -n ops/setup-local-vision-vps.sh
