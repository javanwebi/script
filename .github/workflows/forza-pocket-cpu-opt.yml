name: FORZA Pocket CPU tuning audit
on:
  pull_request:
    paths:
      - ops/forza-pocket-cpu-opt-benchmark-vps.sh
      - .github/workflows/forza-pocket-cpu-opt.yml
  push:
    branches: [main]
    paths:
      - ops/forza-pocket-cpu-opt-benchmark-vps.sh
      - .github/workflows/forza-pocket-cpu-opt.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  script:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Check Bash, embedded Node and Python syntax
        run: |
          bash -n ops/forza-pocket-cpu-opt-benchmark-vps.sh
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          text = Path("ops/forza-pocket-cpu-opt-benchmark-vps.sh").read_text()
          node = text.split("node - <<'JS'\n", 1)[1].split("\nJS\n", 1)[0]
          subprocess.run(["node", "--check", "-"], input=node, text=True, check=True)
          dockerfile = text.split("cat > \"$STAGE/Dockerfile\" <<'DOCKER'\n", 1)[1].split("\nDOCKER\n",1)[0]
          patch = dockerfile.split("RUN python3 - <<'PY'\n", 1)[1].split("\nPY",1)[0]
          compile(patch, "candidate_pocket_patch.py", "exec")
          for marker in ("FORZA_CPU_OPT_BENCH_PASS", "FORZA_CPU_PROFILE_DONE",
                         "VOICE_SHA", "STATE_SHA", "memory.peak",
                         "FORZA_CPU_RESULT"):
              assert marker in text
          for dangerous in ("docker stop", "docker restart", "docker update",
                            "docker rename", "docker rm -f \"$LIVE\"",
                            "docker rm -f \"$SITE\""):
              assert dangerous not in text
          print("FORZA_POCKET_CPU_SCRIPT_OK")
          PY
