name: Verify local vision crop proposals and worker protocol

on:
  pull_request:
    branches: [main]
    paths:
      - 'services/local-vision/**'
      - 'tests/image-region-interaction.test.ts'
      - 'src/utils/imageRegionFallback.ts'
      - 'src/services/localVision.ts'
      - 'src/services/localModelSuggestions.ts'
      - 'server.ts'
      - '.github/workflows/local-vision-regions.yml'

permissions:
  contents: read

jobs:
  local-vision-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: services/local-vision/requirements.txt
      - name: Install pinned CPU inference and image dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir --index-url https://download.pytorch.org/whl/cpu 'torch==2.8.0+cpu'
          python -m pip install --no-cache-dir -r services/local-vision/requirements.txt
      - name: Test separate foreground proposals and worker crop protocol
        run: python -m unittest discover -s services/local-vision -p 'test_*.py'
