name: FORZA Live Gateway

on:
  pull_request:
    branches: [main]
    paths:
      - "server.ts"
      - "server/ai/forzaLiveGateway.ts"
      - "src/components/forza/AiForzaLiveExperience.tsx"
      - "src/components/forza/forzaRealtimeClient.ts"
      - "src/pages/AiForzaPage.tsx"
      - "src/components/search/AiForzaFaceToFaceModal.tsx"
      - "src/components/layout/RouteIntentPreload.tsx"
      - "tests/forza-live-gateway.test.ts"
      - "tests/forza-live-experience.test.ts"
      - "tests/forza-live-browser-simulation.test.ts"
      - "tests/forzaVoiceRecoveryUi.test.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/forza-live-gateway.yml"
  push:
    branches:
      - "feat/forza-live-gateway-*"
    paths:
      - "server.ts"
      - "server/ai/forzaLiveGateway.ts"
      - "src/components/forza/AiForzaLiveExperience.tsx"
      - "src/components/forza/forzaRealtimeClient.ts"
      - "src/pages/AiForzaPage.tsx"
      - "src/components/search/AiForzaFaceToFaceModal.tsx"
      - "src/components/layout/RouteIntentPreload.tsx"
      - "tests/forza-live-gateway.test.ts"
      - "tests/forza-live-experience.test.ts"
      - "tests/forza-live-browser-simulation.test.ts"
      - "tests/forzaVoiceRecoveryUi.test.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/forza-live-gateway.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forza-live-gateway-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install pinned visual runtime for full-project typecheck
        run: npm install --no-save --package-lock=false --legacy-peer-deps --no-audit --no-fund onnxruntime-web@1.18.0

      - name: Test realtime gateway and browser simulation
        run: npm run test:forza-live

      - name: TypeScript validation
        run: npm run lint
