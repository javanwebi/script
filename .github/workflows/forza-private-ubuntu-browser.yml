name: FORZA private Ubuntu Pocket browser integration
on:
  pull_request:
    paths:
      - 'src/components/forza/**'
      - 'src/services/forzaGreetingAudio.ts'
      - 'server.ts'
      - 'scripts/tests/forza-pocket-ubuntu-browser.cjs'
      - '.github/workflows/forza-private-ubuntu-browser.yml'
      - 'tests/forza-boot-speech.test.ts'
      - 'src/utils/forzaStreamingSpeech.ts'
      - 'src/utils/forzaContinuousWav.ts'
      - 'src/utils/forzaWavFrames.ts'
      - 'tests/forza-wav-frames.test.ts'
      - 'scripts/forza_pocket_worker.py'
      - 'scripts/forza_voice_http.py'
      - 'scripts/tests/forza-live-stt-browser.cjs'
      - 'tests/forza-continuous-wav.test.ts'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Validate progressive Python worker syntax
        run: |
          python3 -m py_compile scripts/forza_pocket_worker.py scripts/forza_voice_http.py
          bash -n ops/forza-voice-stream-benchmark-vps.sh
      - name: Validate source and private TTS contract
        run: |
          npm run lint
          node --import tsx --test tests/forza-boot-speech.test.ts tests/forza-streaming-speech.test.ts tests/forza-continuous-wav.test.ts tests/forza-speech-chunks.test.ts tests/forza-wav-frames.test.ts
      - name: Prepare Vite runtime
        run: |
          npm pkg set overrides.tslib=2.8.1
          npm install --no-save --package-lock=false --legacy-peer-deps --no-audit --no-fund @mintplex-labs/piper-tts-web@1.0.5 onnxruntime-web@1.18.0 @diffusionstudio/piper-wasm@1.0.0 vosk-browser@0.0.8
          mkdir -p public/forza-runtime/{ort,piper,stt}
          cp node_modules/onnxruntime-web/dist/ort-wasm*.wasm public/forza-runtime/ort/
          cp node_modules/@diffusionstudio/piper-wasm/build/piper_phonemize.{data,wasm} public/forza-runtime/piper/
          cp node_modules/vosk-browser/dist/vosk.js public/forza-runtime/stt/
          npm run build
      - run: npm install --no-save --ignore-scripts --legacy-peer-deps playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Start static app preview
        run: |
          nohup npx vite preview --host 127.0.0.1 --port 4173 > /tmp/forza-preview.log 2>&1 &
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:4173/ai-forza >/dev/null && exit 0; sleep 1; done
          cat /tmp/forza-preview.log; exit 1
      - name: Exercise SSE to private Pocket WAV playback in real Chromium
        run: |
          node scripts/tests/forza-pocket-ubuntu-browser.cjs
          node scripts/tests/forza-live-stt-browser.cjs
