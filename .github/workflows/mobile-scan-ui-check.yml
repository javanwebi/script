
name: Verify Sanat Pish mobile dock and camera scan
on:
  pull_request:
    paths:
      - "src/components/layout/MobileBottomBar.tsx"
      - "src/components/catalog/MobileCategoryExplorer.tsx"
      - "src/components/catalog/ReferenceMegaMenu.tsx"
      - "src/components/catalog/mobile-category-explorer.css"
      - "tests/mobile-category-drawer.test.ts"
      - "scripts/tests/mobile-category-drawer-smoke.cjs"
      - "src/components/layout/industrial-mobile-nav.css"
      - "src/components/layout/Layout.tsx"
      - "src/components/search/**"
      - "public/images/precision-scan-technical-overlay.svg"
      - "tests/mobile-scan-ui.test.ts"
      - "tests/image-region-interaction.test.ts"
      - "scripts/tests/image-region-interaction.cjs"
      - "src/utils/imageRegionInteraction.ts"
      - ".github/workflows/mobile-scan-ui-check.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-ui-check:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npm run lint
      - name: Mobile scan source regression tests
        run: node --import tsx --test tests/mobile-scan-ui.test.ts tests/image-region-interaction.test.ts tests/local-model-results.test.tsx tests/local-vision.test.ts
      - name: Category drawer and approved taxonomy source tests
        run: node --import tsx --test tests/mobile-category-drawer.test.ts
      - name: Production bundle build
        run: npm run build
      - name: Install chromium for mobile drawer screenshots
        run: |
          npm install --no-save --ignore-scripts --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Launch local storefront preview
        run: |
          nohup npx vite preview --host 127.0.0.1 --port 4173 > /tmp/sanat-category-preview.log 2>&1 &
          for i in $(seq 1 50); do
            if curl -sf http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/sanat-category-preview.log
          exit 1
      - name: Image selection by pointer, touch, drag and keyboard
        run: node scripts/tests/image-region-interaction.cjs
      - name: Screenshot and interaction tests at four mobile widths
        run: node scripts/tests/mobile-category-drawer-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sanat-home-mobile-category-drawer
          path: /tmp/sanat-mobile-category-*.png
          if-no-files-found: ignore
