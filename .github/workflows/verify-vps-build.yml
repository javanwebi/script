name: Verify VPS frontend build before deployment
on:
  pull_request:
    branches: [main]
    paths:
      - "src/components/storefront/HomeOverview.tsx"
      - "src/pages/HomePage.tsx"
      - "src/pages/DiscoveryPages.tsx"
      - "src/pages/TextileIndustryPage.tsx"
      - "src/pages/BeltCategoryExperience.tsx"
      - "src/pages/BeltCategoryExperience.css"
      - "src/pages/ProductsPage.tsx"
      - "src/pages/products-page-premium.css"
      - "src/pages/CategoryPage.tsx"
      - "src/category-showcase.css"
      - "src/components/product/ProductCard.tsx"
      - "src/components/layout/Header.tsx"
      - "src/components/catalog/ReferenceMegaMenu.tsx"
      - "src/components/catalog/MobileCategoryExplorer.tsx"
      - "src/components/catalog/mobile-category-explorer.css"
      - "src/reference-menu.css"
      - "src/storefront.css"
      - "src/data/categories.ts"
      - "src/App.tsx"
      - "tests/products-page-premium.test.ts"
      - "tests/customer-pricing-visibility.test.ts"
      - "tests/storefront-product-route-integrity.test.ts"
      - "scripts/tests/products-catalogue-responsive-smoke.cjs"
      - "src/pages/ProductDetailPage.tsx"
      - "src/pages/product-detail-premium.css"
      - "tests/product-detail-premium.test.ts"
      - "scripts/tests/product-detail-responsive-smoke.cjs"
      - "src/pages/AllCategoriesPage.tsx"
      - "src/pages/all-categories-premium.css"
      - "tests/all-categories-page-premium.test.ts"
      - "scripts/tests/all-categories-responsive-smoke.cjs"
      - "src/pages/ExcelMenuCategoryPage.tsx"
      - "src/pages/excel-menu-category-premium.css"
      - "tests/excel-menu-category-premium.test.ts"
      - "scripts/tests/excel-menu-category-responsive-smoke.cjs"
      - "src/textile-industry.css"
      - "tests/textile-industry-premium.test.ts"
      - "scripts/tests/textile-industry-responsive-smoke.cjs"
      - "tests/industry-pages-unique-layouts.test.ts"
      - "tests/belt-category-experience.test.ts"
      - "scripts/tests/belt-category-responsive-smoke.cjs"
      - ".github/workflows/verify-vps-build.yml"
  push:
    branches: [main, feature/textile-industry-page]
    paths:
      - "src/**"
      - "server.ts"
      - "server/auth/**"
      - "api/sms.ts"
      - "tests/supabase-sms-hook.test.ts"
      - "tests/mobile-scan-ui.test.ts"
      - "vite.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/verify-vps-build.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exactly as VPS candidate
        run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npm run lint
      - name: Products catalogue regression suite
        run: node --import tsx --test tests/products-page-premium.test.ts
      - name: Storefront product route and category integrity
        run: node --import tsx --test tests/storefront-product-route-integrity.test.ts tests/customer-pricing-visibility.test.ts
      - name: Product detail regression suite
        run: node --import tsx --test tests/product-detail-premium.test.ts
      - name: All categories regression suite
        run: node --import tsx --test tests/all-categories-page-premium.test.ts
      - name: Excel menu category regression suite
        run: node --import tsx --test tests/excel-menu-category-premium.test.ts
      - name: Textile industry regression suite
        run: node --import tsx --test tests/textile-industry-premium.test.ts
      - name: Industry page regression suite
        run: node --import tsx --test tests/industry-pages-unique-layouts.test.ts
      - name: Belt category reference and regression suite
        run: node --import tsx --test tests/belt-category-experience.test.ts
      - name: Supabase SMS hook signature safety
        run: node --import tsx --test tests/supabase-sms-hook.test.ts
      - name: FORZA mobile support panel and swipe gesture
        run: node --import tsx --test tests/forza-mobile-contact-sheet.test.ts
      - name: Mobile camera capture and confirmation flow
        run: node --import tsx --test tests/mobile-scan-ui.test.ts
      - name: Build as VPS
        run: npm run build 2>&1 | tee /tmp/forza-vps-build.log; exit ${PIPESTATUS[0]}
      - name: Install Chromium for belt category responsive smoke
        run: |
          npm install --no-save --ignore-scripts --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Launch production preview for catalogue browser tests
        run: |
          nohup npx vite preview --host 127.0.0.1 --port 4173 > /tmp/storefront-preview.log 2>&1 &
          for i in $(seq 1 50); do
            if curl -sf http://127.0.0.1:4173/products >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/storefront-preview.log
          exit 1
      - name: Verify belt category desktop and mobile interactions
        run: node scripts/tests/belt-category-responsive-smoke.cjs
      - name: Verify products catalogue desktop and mobile interactions
        run: node scripts/tests/products-catalogue-responsive-smoke.cjs
      - name: Verify product detail desktop and mobile interactions
        run: node scripts/tests/product-detail-responsive-smoke.cjs
      - name: Verify all categories desktop and mobile interactions
        run: node scripts/tests/all-categories-responsive-smoke.cjs
      - name: Verify Excel menu category desktop and mobile interactions
        run: node scripts/tests/excel-menu-category-responsive-smoke.cjs
      - name: Verify textile industry desktop and mobile interactions
        run: node scripts/tests/textile-industry-responsive-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storefront-responsive-screenshots
          path: |
            /tmp/belt-category-*.png
            /tmp/products-catalogue-*.png
            /tmp/product-detail-*.png
            /tmp/all-categories-*.png
            /tmp/excel-category-*.png
            /tmp/textile-industry-*.png
          if-no-files-found: ignore
      - name: Print focused Vite failure
        if: failure()
        run: |
          grep -n -E 'error|Error|Could not|Cannot|failed|Failed|resolve|Build' /tmp/forza-vps-build.log | tail -n 90 || true
