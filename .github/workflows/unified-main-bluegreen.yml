name: Unified Sanat Pish main integration
on:
  push:
    branches:
      - integration/unified-main-bluegreen-20261103
      - main
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-unified-app:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript lint
        run: npm run lint
      - name: Preserve mobile scanner, FORZA swipe, SMS and homepage tests
        run: |
          node --import tsx --test tests/mobile-scan-ui.test.ts tests/forza-mobile-contact-sheet.test.ts tests/supabase-sms-hook.test.ts tests/home-initial-load.test.ts tests/home-image-loading.test.ts tests/home-fast-preview.test.ts tests/home-approved-category-strip.test.ts
      - name: Verify blue-green script syntax and safe pointers
        run: |
          bash -n ops/deploy-main-bluegreen-vps.sh
          bash -n ops/deploy-single-port-vps.sh
          bash -n ops/fix-nginx-api-write-routing-vps.sh
          bash -n ops/diagnose-nginx-active-domain-vhost-vps.sh
          python3 - <<'PY'
          import ast,re
          from pathlib import Path
          for filename in ('ops/deploy-single-port-vps.sh','ops/fix-nginx-api-write-routing-vps.sh','ops/diagnose-nginx-active-domain-vhost-vps.sh'):
              source=Path(filename).read_text()
              blocks=re.findall(r"<<'PY'\s*\n(.*?)\nPY",source,re.S)
              assert blocks,('NO_PYTHON_HEREDOC',filename)
              for index,block in enumerate(blocks):
                  ast.parse(block,filename=f'{filename}:python-heredoc-{index+1}')
              print('PYTHON_HEREDOC_SYNTAX_OK',filename,len(blocks))
          PY
          node --import tsx --test tests/single-port-deploy.test.ts
          node --import tsx --test tests/production-catalog-recovery.test.ts
          node --import tsx --test tests/production-category-bootstrap.test.ts
          node --import tsx --test tests/bluegreen-domain-routing.test.ts
          bash -n ops/sanatpish-deploy-main.sh
          bash -n ops/deploy-forza-nima-pinned-vps.sh
          grep -Fq 'PINNED PRIVATE NIMA CANARY' ops/deploy-main-bluegreen-vps.sh
          grep -Fq 'FORZA_NIMA_PINNED_RELEASE_OK' ops/deploy-forza-nima-pinned-vps.sh
          grep -Fq 'git fetch origin main' ops/sanatpish-deploy-main.sh
          grep -Fq 'SANATPISH_MAIN_BLUEGREEN_DEPLOY_OK' ops/deploy-main-bluegreen-vps.sh
          grep -Fq 'NGINX_ROLLBACK_OK' ops/deploy-main-bluegreen-vps.sh
          ! grep -Fq "grep -RlF 'صفحه را به بالا بکشید'" ops/deploy-main-bluegreen-vps.sh
      - name: Build from merged main source
        run: npm run build
      - name: Assert retained UI, catalog and imagery
        run: |
          set -euo pipefail
          grep -RlF 'forza-swipe-instruction' dist/assets --include='*.js' >/dev/null
          grep -RlF 'full-screen-camera-experience' dist/assets --include='*.js' >/dev/null
          grep -RlF 'sanat-identification-open' dist/assets --include='*.js' >/dev/null
          grep -RlF 'store-scan-action' dist/assets --include='*.js' >/dev/null
          grep -RlF 'home-category-group' dist/assets --include='*.js' >/dev/null
          grep -RlF 'sp-vision-analysis__viewer' dist/assets --include='*.css' >/dev/null
          test -s dist/images/scan-industrial-generated.webp
          test -s dist/images/precision-scan-technical-overlay.svg
          test "$(find dist/assets -maxdepth 1 -type f -name '*.webp' | wc -l)" -ge 21
