name: Combined optimized WebP storefront and full-screen scanner
on:
  push:
    branches: [release/home-webp-mobile-camera-bluegreen-20261103]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npm run lint
      - name: Validate production blue-green deployment shell syntax
        run: |
          bash -n ops/deploy-mobile-camera-bluegreen-vps.sh
          grep -Fq 'MOBILE_CAMERA_WEBP_BLUEGREEN_DEPLOY_OK' ops/deploy-mobile-camera-bluegreen-vps.sh
          grep -Fq 'NGINX_ROLLBACK_OK' ops/deploy-mobile-camera-bluegreen-vps.sh
      - name: FORZA mobile contact panel and swipe gesture regression
        run: node --import tsx --test tests/forza-mobile-contact-sheet.test.ts
      - name: Camera and dock regression
        run: node --import tsx --test tests/mobile-scan-ui.test.ts
      - name: Build optimized storefront with camera
        run: npm run build
      - name: Verify camera controls, image assets and optimized WebP bundle
        run: |
          set -euo pipefail
          grep -RlF 'full-screen-camera-experience' dist/assets --include='*.js' >/dev/null
          grep -RlF 'عکس‌برداری مجدد' dist/assets --include='*.js' >/dev/null
          grep -RlF 'vision-analyzing-screen' dist/assets --include='*.js' >/dev/null
          grep -RlF 'sanat-identification-open' dist/assets --include='*.js' >/dev/null
          grep -RlF 'forza-mobile-contact-sheet' dist/assets --include='*.js' >/dev/null
          grep -RlF 'صفحه را به بالا بکشید' dist/assets --include='*.js' >/dev/null
          grep -RlF 'store-scan-action' dist/assets --include='*.js' >/dev/null
          grep -RlF 'sp-vision-analysis__viewer' dist/assets --include='*.css' >/dev/null
          grep -RlF 'sanat-camera-experience__stage' dist/assets --include='*.css' >/dev/null
          test -s dist/images/scan-industrial-generated.webp
          test -s dist/images/precision-scan-technical-overlay.svg
          test "$(find dist/assets -maxdepth 1 -name '*.webp' | wc -l)" -ge 21
