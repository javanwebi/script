name: FORZA autoplay/microphone UX smoke
on:
  pull_request:
    paths:
      - 'src/components/forza/**'
      - 'src/utils/forzaStreamClient.ts'
      - 'src/utils/forzaStreamingSpeech.ts'
      - 'scripts/tests/forza-audio-chunks.cjs'
      - '.github/workflows/forza-browser-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: |
          nohup npx vite preview --host 127.0.0.1 --port 4173 > /tmp/forza-preview.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -sf http://127.0.0.1:4173/ai-forza >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/forza-preview.log
          exit 1
      - run: node scripts/tests/forza-audio-chunks.cjs
