name: FORZA autoplay/microphone UX smoke
on:
  pull_request:
    paths:
      - 'src/components/forza/**'
      - 'src/utils/forzaStreamClient.ts'
      - 'src/utils/forzaStreamingSpeech.ts'
      - 'src/utils/forzaBootPolicy.ts'
      - 'src/utils/forzaBrowserSpeech.ts'
      - 'src/utils/forzaLocalSpeech.ts'
      - 'src/services/forzaLocalTtsFallback.ts'
      - 'scripts/generate-forza-greeting.mjs'
      - 'tests/forzaLocalTtsFallback.test.ts'
      - 'scripts/tests/forza-greeting-fallback.cjs'
      - 'src/utils/forzaPersianVoiceQuality.ts'
      - 'src/utils/forzaSpeechChunks.ts'
      - 'tests/forzaPersianVoiceQuality.test.ts'
      - 'server.ts'
      - 'scripts/tests/forza-amir-real-browser.cjs'
      - 'scripts/tests/forza-browser-voice-mock.cjs'
      - 'src/main.tsx'
      - 'scripts/tests/forza-audio-chunks.cjs'
      - 'scripts/tests/forza-voice-outage.cjs'
      - '.github/workflows/forza-browser-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install offline Persian TTS for smoke tests
        run: sudo apt-get update && sudo apt-get install -y espeak-ng
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Validate Persian voice text normalization and WAV leveling
        run: node --import tsx --test tests/forzaPersianVoiceQuality.test.ts
      - name: Validate offline Persian speech fallback
        run: node --import tsx --test tests/forzaLocalTtsFallback.test.ts
      - name: Install pinned FORZA browser voice dependencies
        run: npm install --no-save --package-lock=false --legacy-peer-deps --no-audit --no-fund @mintplex-labs/piper-tts-web@1.0.5 onnxruntime-web@1.18.0 @diffusionstudio/piper-wasm@1.0.0 vosk-browser@0.0.8
      - name: Stage the same WASM files as the production Dockerfile
        run: |
          mkdir -p public/forza-runtime/ort public/forza-runtime/piper public/forza-runtime/stt
          cp node_modules/onnxruntime-web/dist/ort-wasm*.wasm public/forza-runtime/ort/
          cp node_modules/@diffusionstudio/piper-wasm/build/piper_phonemize.data public/forza-runtime/piper/
          cp node_modules/@diffusionstudio/piper-wasm/build/piper_phonemize.wasm public/forza-runtime/piper/
          cp node_modules/vosk-browser/dist/vosk.js public/forza-runtime/stt/
          file public/forza-runtime/ort/ort-wasm-simd.wasm
      - run: npm run build
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: |
          nohup npx vite preview --host 127.0.0.1 --port 4173 > /tmp/forza-preview.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -sf http://127.0.0.1:4173/ai-forza >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/forza-preview.log
          exit 1
      - run: node scripts/tests/forza-audio-chunks.cjs
      - run: node scripts/tests/forza-voice-outage.cjs
      - run: node scripts/tests/forza-greeting-fallback.cjs
      - name: Actual Persian Amir voice synthesis in Chromium
        run: node scripts/tests/forza-amir-real-browser.cjs
        timeout-minutes: 7
