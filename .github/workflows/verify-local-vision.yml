name: Verify local vision region proposals

on:
  pull_request:
    paths:
      - "services/local-vision/**"
      - "src/services/localVision.ts"
      - "src/services/localModelSuggestions.ts"
      - "src/services/aiVisualSearchService.ts"
      - "src/components/search/**"
      - "server.ts"
      - "ops/setup-local-vision-vps.sh"
      - ".github/workflows/verify-local-vision.yml"
  push:
    branches: [main]
    paths:
      - "services/local-vision/**"
      - "src/services/localVision.ts"
      - "src/services/localModelSuggestions.ts"
      - "src/services/aiVisualSearchService.ts"
      - "src/components/search/**"
      - "server.ts"
      - "ops/setup-local-vision-vps.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-vision:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/local-vision/requirements.txt
      - name: Install CPU-only test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir --index-url https://download.pytorch.org/whl/cpu "torch==2.8.0+cpu"
          python -m pip install --no-cache-dir -r services/local-vision/requirements.txt
      - name: Run object proposal and worker protocol tests
        working-directory: services/local-vision
        run: python -m unittest test_retrieval.py test_worker.py
      - name: Check private sidecar setup script syntax
        run: bash -n ops/setup-local-vision-vps.sh
