name: Temporary source export
on:
  push:
    branches:
      - tmp/export-main-source-20261121
    paths:
      - 'tmp/export/READY_SOURCE'
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Package tracked source and tests without large catalog media
        shell: bash
        run: |
          set -euo pipefail
          {
            git ls-files | grep -E '^(src|tests|scripts|ops|\.github/workflows)/' \
              | grep -Ev '^src/assets/' \
              | grep -Ev '^src/data/.*\.json$' \
              | grep -E '\.(ts|tsx|js|jsx|css|mjs|cjs|sh|yml|yaml|md|svg)$'
            printf '%s\\n' package.json package-lock.json tsconfig.json vite.config.ts server.ts Dockerfile
          } | sort -u | tar -czf /tmp/sanatpish-main-code-source.tar.gz -T -
          ls -lh /tmp/sanatpish-main-code-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: sanatpish-main-code-source
          path: /tmp/sanatpish-main-code-source.tar.gz
          retention-days: 1
