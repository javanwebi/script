<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="400" viewBox="0 0 1440 400" role="img" aria-labelledby="title desc">
  <title id="title">ورود به حساب مشتریان صنعت پیش</title>
  <desc id="desc">بنر صنعتی با تصویر پولی و تجهیزات انتقال نیرو و دعوت به ورود به میزکار صنعت پیش</desc>
  <defs>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#101b24" stop-opacity=".08"/><stop offset=".42" stop-color="#101b24" stop-opacity=".48"/><stop offset=".7" stop-color="#101b24" stop-opacity=".92"/><stop offset="1" stop-color="#101b24" stop-opacity=".98"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f28a3c"/><stop offset="1" stop-color="#d95712"/></linearGradient>
    <radialGradient id="glow" cx="70%" cy="50%" r="65%"><stop stop-color="#e56b1e" stop-opacity=".24"/><stop offset="1" stop-color="#e56b1e" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#fff" stroke-opacity=".055" stroke-width="1"/></pattern>
  </defs>
  <image href="/images/hero/hero-pulley.webp" x="0" y="0" width="1440" height="400" preserveAspectRatio="xMidYMid slice"/>
  <rect width="1440" height="400" fill="url(#shade)"/>
  <rect width="1440" height="400" fill="url(#glow)"/>
  <rect width="1440" height="400" fill="url(#grid)" opacity=".42"/>
  <path d="M0 0H20V400H0Z" fill="url(#accent)"/>
  <path d="M760 0L690 400" stroke="#e56b1e" stroke-opacity=".72" stroke-width="3"/>
  <g opacity=".28" fill="none" stroke="#e56b1e">
    <circle cx="180" cy="205" r="142" stroke-width="2"/><circle cx="180" cy="205" r="120" stroke-width="1"/>
    <circle cx="180" cy="205" r="98" stroke-width="8" stroke-dasharray="8 13"/>
  </g>
  <g direction="rtl" font-family="Vazirmatn, Tahoma, sans-serif" text-anchor="end">
    <g transform="translate(1320 72)">
      <circle cx="-20" cy="-12" r="22" fill="none" stroke="#e56b1e" stroke-width="9"/>
      <circle cx="-20" cy="-12" r="8" fill="#e56b1e"/>
      <text x="-58" y="-2" fill="#fff" font-size="36" font-weight="800">صنعت پیش</text>
      <text x="-58" y="27" fill="#d9e0e5" font-size="15" font-weight="500">پیش به صنعت</text>
    </g>
    <text x="1320" y="174" fill="#fff" font-size="49" font-weight="800">به میزکار خود در صنعت پیش</text>
    <text x="1320" y="236" fill="#ff8a3d" font-size="56" font-weight="900">وارد شوید</text>
    <path d="M1100 260H1320" stroke="#e56b1e" stroke-width="5" stroke-linecap="round"/>
    <text x="1320" y="315" fill="#f4f6f8" font-size="24" font-weight="500">دسترسی سریع به کاتالوگ، سفارش‌ها و</text>
    <text x="1320" y="352" fill="#f4f6f8" font-size="24" font-weight="500">خدمات هوشمند FORZA</text>
  </g>
